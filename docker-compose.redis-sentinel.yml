services:
  redis-master:
    image: redis:7-alpine
    container_name: bcn_redis_master
    command: ["redis-server", "--port", "6379"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    container_name: bcn_redis_replica
    command: ["redis-server", "--port", "6379", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: bcn_redis_sentinel_1
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint: >
      sh -c 'printf "port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26379:26379"

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: bcn_redis_sentinel_2
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint: >
      sh -c 'printf "port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26380:26379"

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: bcn_redis_sentinel_3
    depends_on:
      redis-master:
        condition: service_healthy
    entrypoint: >
      sh -c 'printf "port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26381:26379"
