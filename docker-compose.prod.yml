services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: bcn_quiz
    restart: unless-stopped
    depends_on:
      quiz-postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '127.0.0.1:${HOST_PORT}:${PORT}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
    networks:
      - default
      - profiles-network

  quiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  quiz_postgres_data:

networks:
  profiles-network:
    external: true
    name: bcn_profiles_default
